name: Editor build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and check the arm64 editor
        run: ./scripts/build.sh
      - name: Build the standalone mod manager
        run: ./scripts/build-mod-manager.sh
